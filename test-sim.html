<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #out { position: fixed; inset: 0; z-index: 9999; background: #000; color: #0f0;
           font: 11px monospace; white-space: pre; overflow: auto; padding: 8px; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game-canvas"></div>
  </div>
  <pre id="out">starting...</pre>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="game.js"></script>
  <script>
    const out = document.getElementById('out');
    let lines = [];
    const log = (...a) => { lines.push(a.map(String).join(' ')); out.textContent = lines.join('\n'); };
    window.onerror = (m, s, l, c, e) => { log('!! JS ERROR: ' + m); };

    let hits = 0;
    window.onGameOver = (alias, score) => { hits++; log('>>> GAME OVER score=' + score); };

    window.addEventListener('load', () => {
      const game = window.startGame('TestUser');
      window.currentGame = game;
      let scene = null;
      let spawned = 0;
      let maxObsY = -Infinity;

      const poll = setInterval(() => {
        try {
          if (!scene) {
            scene = game.scene.getScene('DinoGame');
            if (!scene || !scene.player) return;
            log('scene ready. scale=' + scene.scale.width + 'x' + scene.scale.height);
            const cv = document.querySelector('#game-canvas canvas');
            if (cv) log('canvas backing=' + cv.width + 'x' + cv.height +
                        ' css=' + cv.style.width + 'x' + cv.style.height +
                        ' rect=' + Math.round(cv.getBoundingClientRect().width) + 'x' +
                        Math.round(cv.getBoundingClientRect().height));
            log('cam=' + scene.cameras.main.width + 'x' + scene.cameras.main.height +
                ' zoom=' + scene.cameras.main.zoom);
            log('ground: x=' + Math.round(scene.ground.x) + ' y=' + Math.round(scene.ground.y) +
                ' w=' + scene.ground.width + ' h=' + scene.ground.height +
                ' visible=' + scene.ground.visible);
            log('player: x=' + Math.round(scene.player.x) + ' y=' + Math.round(scene.player.y) +
                ' displayW=' + scene.player.displayWidth + ' displayH=' + scene.player.displayHeight +
                ' visible=' + scene.player.visible);
            log('world bounds: ' + JSON.stringify(game.physics.world.bounds));
          }

          const obs = scene.obstacles.getChildren();
          if (obs.length > spawned) spawned = obs.length;
          obs.forEach(o => { if (o.y > maxObsY) maxObsY = o.y; });

          log('t=' + (game.loop.time / 1000).toFixed(1) + 's fps=' + game.loop.actualFps.toFixed(0) +
              ' score=' + Math.floor(scene.score) + ' speed=' + scene.speed.toFixed(2) +
              ' obsN=' + obs.length + ' maxObsY=' + (maxObsY === -Infinity ? '-' : Math.round(maxObsY)) +
              ' playerY=' + Math.round(scene.player.y) + ' grounded=' + scene.player.body.blocked.down +
              ' over=' + scene.gameOver + ' hits=' + hits + ' spawnCount=' + scene.spawnCount +
              ' playerVy=' + Math.round(scene.player.body.velocity.y) +
              ' playerBodyY=' + Math.round(scene.player.body.y) + ' playerBodyH=' + scene.player.body.height);

          obs.slice(0, 3).forEach((o, i) => {
            log('    obs' + i + ' ' + o.texture.key + ' x=' + Math.round(o.x) + ' y=' + Math.round(o.y) +
                ' visible=' + o.visible + ' vx=' + Math.round(o.body.velocity.x) +
                ' vy=' + Math.round(o.body.velocity.y) +
                ' allowGravity=' + o.body.allowGravity);
          });
        } catch (e) { log('!! poll err: ' + e.message); }
      }, 700);

      setTimeout(() => {
        clearInterval(poll);
        log('=== RESULT ===');
        log('player x vs obstacles: collision never happened? hits=' + hits);
        log('maxObsY=' + (maxObsY === -Infinity ? 'no obstacle ever spawned' : Math.round(maxObsY)));
        log('screen height=' + game.scale.height + ' -> obstacles below screen if y > ' + game.scale.height);
        document.title = 'TEST DONE';
      }, 14000);
    });
  </script>
</body>
</html>
