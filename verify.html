<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dino Runner - Verificación</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="verify-container">
    <h1>🔍 Verificación automática</h1>
    <div id="status-list"></div>
    <button id="rerun-btn" class="ghost">Re-ejecutar verificación</button>
  </div>
  <!-- Contenedor del canvas de Phaser, igual que en index.html -->
  <div id="game-canvas"></div>
  <!-- Scripts necesarios para la verificación -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="game.js"></script>

  <script>
    async function verify() {
      const results = [];

      // 1. Phaser cargado?
      const phaserOk = typeof window.Phaser !== 'undefined';
      results.push({ ok: phaserOk, msg: phaserOk ? 'Phaser.js cargado' : 'Phaser.js NO cargado (CDN caída?)' });

      // Start game for canvas/texture tests
      let gameStarted = false;
      if (phaserOk) {
        try {
          // Start a minimal game instance for verification
          window.currentGame = window.startGame('VerifyUser');
          // Wait a bit for scene to create and textures to generate
          await new Promise(r => setTimeout(r, 500));
          gameStarted = true;
        } catch (e) {
          console.error('Failed to start game for verification:', e);
        }
      }

      // 2. Canvas existe en #game-canvas?
      const canvasEl = document.querySelector('#game-canvas canvas');
      const canvasOk = !!canvasEl;
      results.push({ ok: canvasOk, msg: canvasOk ? 'Canvas Phaser existe en #game-canvas' : 'Canvas Phaser NO existe' });

      // 3. Canvas tiene width>0 y height>0?
      let sizeOk = false, sizeMsg = 'Canvas dimensiones inválidas';
      if (canvasEl) {
        const w = canvasEl.width, h = canvasEl.height;
        sizeOk = w > 0 && h > 0;
        sizeMsg = `Canvas: ${w}×${h}px ${sizeOk ? 'OK' : '(fondo no se renderiza)'}`;
      }
      results.push({ ok: sizeOk, msg: sizeMsg });

      // 4. Texturas dino/cactus/ptero > 0×0?
      let texOk = true, texDetail = [];
      if (gameStarted && window.currentGame && window.currentGame.textures) {
        const keys = ['dino', 'cactus', 'ptero'];
        for (const key of keys) {
          const tex = window.currentGame.textures.get(key);
          const src = tex && tex.getSourceImage();
          const w = src ? src.width : 0;
          const h = src ? src.height : 0;
          texDetail.push(`${key}:${w}×${h}`);
          if (w === 0 || h === 0) texOk = false;
        }
      } else {
        texOk = false;
        texDetail.push('game not started or textures not ready');
      }
      results.push({ ok: texOk, msg: `Texturas: ${texDetail.join(', ')}` });

      // 5. Supabase responde?
      let supaOk = false, supaMsg = 'Verificando...';
      try {
        const url = `${CONFIG.supabaseUrl}/rest/v1/leaderboard?select=alias,score&limit=1`;
        const headers = {
          'apikey': CONFIG.supabaseAnonKey,
          'Authorization': `Bearer ${CONFIG.supabaseAnonKey}`,
          'Accept': 'application/json'
        };
        const res = await fetch(url, { headers });
        supaOk = res.status === 200;
        supaMsg = supaOk ? 'Supabase REST OK (200)' : `Supabase error HTTP ${res.status}`;
        if (supaOk) {
          const data = await res.json();
          supaMsg += ` - ${data.length} fila(s) en leaderboard`;
        }
      } catch (e) {
        supaMsg = 'Supabase fetch falló: ' + e.message;
      }
      results.push({ ok: supaOk, msg: supaMsg });

      // 6. Ranking Top 3 OK?
      let rankOk = false, rankMsg = 'No verificado';
      try {
        const top = await obtenerTop3();
        rankOk = top.length >= 0; // even empty is OK if no error
        rankMsg = `obtenerTop3(): ${top.length} fila(s) OK`;
      } catch (e) {
        rankMsg = 'obtenerTop3() falló: ' + e.message;
      }
      results.push({ ok: rankOk, msg: rankMsg });

      // Cleanup
      if (window.currentGame) {
        window.currentGame.destroy(true);
        window.currentGame = null;
      }

      // Render
      const list = document.getElementById('status-list');
      list.innerHTML = '';
      for (const r of results) {
        const li = document.createElement('li');
        li.textContent = (r.ok ? '✅ ' : '❌ ') + r.msg;
        li.className = r.ok ? 'check-ok' : 'check-fail';
        list.appendChild(li);
      }

      const summary = results.filter(r => r.ok).length + '/' + results.length;
      const h1 = document.querySelector('h1');
      h1.textContent = `🔍 Verificación (${summary} OK)`;
    }

    document.getElementById('rerun-btn').onclick = verify;
    verify();
  </script>
</body>
</html>
