<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <base href="/dodge/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dino Dodge: juego de esquivar meteoritos online gratis</title>
  <meta name="description" content="Esquiva la lluvia de meteoritos en Dino Dodge. Arrastra o usa las flechas, gratis en el navegador y con ranking global.">
  <link rel="canonical" href="https://mydinorun.com/dodge">
  <link rel="stylesheet" href="style.css?v=1">
  <meta name="google-adsense-account" content="ca-pub-5551964617457049">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5551964617457049" crossorigin="anonymous"></script>
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function(o) { adsbygoogle.push(o); };
  </script>
</head>
<body class="article-page" style="background:#1d1f24;">
  <div id="game-container">
    <div id="game-canvas"></div>
    <div id="start-screen">
      <h1>🦖 Dino Dodge: Lluvia de Meteoritos</h1>
      <div class="mode-selector" style="margin: 10px 0;">
        <button class="mode-btn active" data-mode="normal">Clásico</button>
        <button class="mode-btn" data-mode="leyenda">🔥 Leyenda</button>
        <button class="mode-btn" data-mode="lento">🐢 Lento</button>
      </div>
      <p>Comías tranquilo en el valle cuando el volcán despertó. Esquiva la lluvia de fuego. Arrastra o usa ← →.</p>
      <input type="text" id="alias-input" maxlength="15" placeholder="Alias" autocomplete="off">
      <div class="btn-row">
        <button id="start-btn">Jugar</button>
      </div>
      <p class="start-links" style="margin-top:12px;">
        <a href="/">Volver a Dino Runner</a>
        <a href="/guias">📚 Guías</a>
      </p>
    </div>
    <div id="game-over-screen">
      <h2>GAME OVER</h2>
      <p class="final"><span id="over-alias">?</span> · Meteoritos: <span id="final-score-text">0</span></p>
      <div id="position-line">Calculando posición…</div>
      <h3>TOP 3 GLOBAL</h3>
      <ol id="top3-list"></ol>
      <p id="rank-error" class="error"></p>
      <div class="btn-row">
        <button id="share-btn">📤 Compartir</button>
      </div>
      <div class="btn-row">
        <button id="restart-btn">Reiniciar</button>
        <button id="home-btn" class="ghost">🏠 Inicio</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="game.js"></script>
  <script>
    // Gestión de pantallas y botones (similar al runner)
    let currentAlias = localStorage.getItem('dino_alias') || '';

    function showScreen(which) {
      ['start-screen','game-over-screen'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
      const el = document.getElementById(which);
      if (el) el.style.display = 'flex';
    }

    async function onStartClick() {
      const input = document.getElementById('alias-input');
      let alias = (input.value || '').trim();
      if (!alias) alias = `Jugador_${Math.floor(1000 + Math.random() * 9000)}`;
      currentAlias = alias;
      try { localStorage.setItem('dino_alias', alias); } catch(e) {}
      document.getElementById('start-screen').style.display = 'none';
      window.startGame(alias);
    }

    document.getElementById('start-btn').onclick = onStartClick;
    document.getElementById('random-btn')?.addEventListener('click', () => {
      document.getElementById('alias-input').value = `Jugador_${Math.floor(1000 + Math.random() * 9000)}`;
    });

    // Reiniciar (con preservación de modo, aunque Flap no tiene modos)
    document.getElementById('restart-btn').onclick = () => {
      const alias = currentAlias || localStorage.getItem('dino_alias') || 'Jugador_0000';
      try { sessionStorage.setItem('dino_restart_alias', alias); } catch(e) {}
      const _mode = new URLSearchParams(window.location.search).get('mode') || 'normal';
      location.href = location.pathname + (_mode !== 'normal' ? '?mode=' + _mode + '&r=' : '?r=') + Date.now();
    };

    // Inicio
    document.getElementById('home-btn').onclick = () => {
      try {
        sessionStorage.removeItem('dino_restart_alias');
      } catch(e) {}
      location.href = '/';
    };

    // Al cargar, mostrar start
    showScreen('start-screen');

    // Precargar alias
    try {
      const savedAlias = localStorage.getItem('dino_alias');
      if (savedAlias) document.getElementById('alias-input').value = savedAlias;
    } catch(e) {}
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const modeBtns = document.querySelectorAll('.mode-btn');
      const urlMode = new URLSearchParams(window.location.search).get('mode') || 'normal';
      modeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === urlMode);
        btn.addEventListener('click', () => {
          const mode = btn.dataset.mode;
          if (mode === 'normal') {
            window.location.href = '/dodge/index.html';
          } else {
            window.location.href = '/dodge/index.html?mode=' + mode;
          }
        });
      });
    });
  </script>


  <script>
    // Fallback móvil: touchend + pointerup (igual que el runner)
    (function() {
      function attach() {
        const restartBtn = document.getElementById('restart-btn');
        const homeBtn = document.getElementById('home-btn');
        if (!restartBtn || !homeBtn) { setTimeout(attach, 200); return; }

        let __restarting = false;
        const restartHandler = (ev) => {
          if (__restarting) return;
          __restarting = true;
          if (ev) { ev.preventDefault(); ev.stopPropagation(); }
          console.log('[RESTART-FALLBACK] triggered');
          const alias = (typeof currentAlias !== 'undefined' && currentAlias)
                     || localStorage.getItem('dino_alias') || 'Jugador_0000';
          try { sessionStorage.setItem('dino_restart_alias', alias); } catch(e) {}
          const mode = new URLSearchParams(window.location.search).get('mode') || 'normal';
          const url = location.pathname + (mode !== 'normal' ? '?mode=' + mode + '&r=' : '?r=') + Date.now();
          console.log('[RESTART-FALLBACK] ->', url);
          location.href = url;
          setTimeout(() => { __restarting = false; }, 2000);
        };

        let __homeGoing = false;
        const homeHandler = (ev) => {
          if (__homeGoing) return;
          __homeGoing = true;
          if (ev) { ev.preventDefault(); ev.stopPropagation(); }
          console.log('[HOME-FALLBACK] triggered');
          try { sessionStorage.removeItem('dino_restart_alias'); } catch(e) {}
          location.href = '/';
          setTimeout(() => { __homeGoing = false; }, 2000);
        };

        restartBtn.addEventListener('touchend', restartHandler, { passive: false });
        restartBtn.addEventListener('pointerup', restartHandler);
        homeBtn.addEventListener('touchend', homeHandler, { passive: false });
        homeBtn.addEventListener('pointerup', homeHandler);
        console.log('[FALLBACK] restart + home attached');
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attach);
      } else {
        attach();
      }
    })();
  </script>

<!-- FIX-INNERH: altura visible real en Chrome Android (100vh incluye la barra de direcciones) -->
<script>
(function () {
  function fit() {
    var g = document.getElementById('game-container');
    if (!g) return;
    var h = Math.round(window.innerHeight) + 'px';
    g.style.setProperty('height', h, 'important');
    g.style.setProperty('min-height', h, 'important');
    g.style.setProperty('max-height', h, 'important');
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 150); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
})();
</script>
<!-- DEBUG-VIEWPORT: solo con ?debug=1 -->
<script>
(function () {
  if (new URLSearchParams(location.search).get('debug') !== '1') return;
  var o = document.createElement('div');
  o.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;border:3px solid #0f0;z-index:99999;pointer-events:none;box-sizing:border-box';
  var t = document.createElement('pre');
  t.style.cssText = 'position:absolute;left:6px;top:40px;margin:0;padding:4px 6px;background:rgba(0,0,0,.75);color:#0f0;font:12px monospace;white-space:pre-wrap';
  o.appendChild(t);
  document.body.appendChild(o);
  function f() {
    var c = document.querySelector('canvas'), g = document.getElementById('game-container');
    var r = c ? c.getBoundingClientRect() : null, q = g ? g.getBoundingClientRect() : null, v = window.visualViewport;
    t.textContent =
      'innerH ' + innerHeight + ' | clientH ' + document.documentElement.clientHeight + ' | vv ' + (v ? Math.round(v.height) : '-') + ' | scrollY ' + Math.round(scrollY) + '\n' +
      'container top ' + (q ? Math.round(q.top) : '-') + ' bottom ' + (q ? Math.round(q.bottom) : '-') + '\n' +
      'canvas top ' + (r ? Math.round(r.top) : '-') + ' bottom ' + (r ? Math.round(r.bottom) : '-') + ' attr ' + (c ? c.width + 'x' + c.height : '-') + '\n' +
      'dpr ' + devicePixelRatio;
  }
  setInterval(f, 500);
  f();
})();
</script>

  <script>
    // === Boton Compartir ===
    (function () {
      const btn = document.getElementById('share-btn');
      if (!btn) return;
      const URL_JUEGO = 'https://mydinorun.com/dodge';
      let busy = false;
      async function compartir(ev) {
        if (ev && ev.type === 'pointerup' && ev.pointerType === 'mouse') return;
        if (busy) return;
        busy = true;
        setTimeout(function () { busy = false; }, 1500);
        const score = document.getElementById('final-score-text').textContent;
        const m = (document.getElementById('position-line').textContent || '').match(/#(\d+)/);
        const puesto = m ? ' (puesto #' + m[1] + ' del mundo)' : '';
        const text = '🦖 Hice ' + score + ' puntos en Dino Dodge' + puesto + '. ¿Puedes superarme?';
        try {
          if (navigator.share) {
            await navigator.share({ title: 'Dino Dodge', text: text, url: URL_JUEGO });
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
        try {
          await navigator.clipboard.writeText(text + ' ' + URL_JUEGO);
          btn.textContent = '✅ Copiado';
          setTimeout(function () { btn.textContent = '📤 Compartir'; }, 2000);
        } catch (e) {
          window.prompt('Copia tu mensaje:', text + ' ' + URL_JUEGO);
        }
      }
      btn.addEventListener('click', compartir);
      btn.addEventListener('pointerup', compartir);
    })();
  </script>
</body>
</html>
